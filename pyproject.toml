[project]
name = "tryops"
version = "0.1.0"
description = "Enterprise open-source MLOps platform for VTON and optimized LLM serving."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "mlflow>=2.14",
  "dvc[s3]>=3.50",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "evidently>=0.4",
]

[project.optional-dependencies]
ml = [
  "torch>=2.3",
  "transformers>=4.42",
  "open_clip_torch>=2.26",
  "diffusers>=0.29",
  "accelerate>=0.31",
  "bitsandbytes>=0.43",
]
serving = [
  "vllm>=0.5",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
