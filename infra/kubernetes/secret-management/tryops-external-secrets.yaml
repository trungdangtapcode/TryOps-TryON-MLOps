apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tryops-runtime-secrets
  namespace: tryops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tryops-vault
    kind: SecretStore
  target:
    name: tryops-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: TRYOPS_POSTGRES_PASSWORD
      remoteRef:
        key: tryops/postgres
        property: password
    - secretKey: TRYOPS_MINIO_ROOT_USER
      remoteRef:
        key: tryops/minio
        property: root_user
    - secretKey: TRYOPS_MINIO_ROOT_PASSWORD
      remoteRef:
        key: tryops/minio
        property: root_password
    - secretKey: TRYOPS_GATEWAY_QUOTA_POSTGRES_DSN
      remoteRef:
        key: tryops/gateway
        property: quota_postgres_dsn
    - secretKey: TRYOPS_WEBHOOK_SECRET
      remoteRef:
        key: tryops/controller
        property: registry_webhook_secret
    - secretKey: TRYOPS_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: tryops/controller
        property: github_webhook_secret
    - secretKey: TRYOPS_TLS_CERT_PEM
      remoteRef:
        key: tryops/tls
        property: cert_pem
    - secretKey: TRYOPS_TLS_KEY_PEM
      remoteRef:
        key: tryops/tls
        property: key_pem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tryops-gateway
  namespace: tryops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tryops-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tryops-gateway
    spec:
      serviceAccountName: tryops-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: vault-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
      containers:
        - name: gateway
          image: ghcr.io/tryops/gateway:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: tryops-runtime-secrets
          volumeMounts:
            - name: vault-identity-token
              mountPath: /var/run/secrets/tryops/vault
              readOnly: true
