apiVersion: v1
kind: Namespace
metadata:
  name: tryops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tryops-runtime
  namespace: tryops
  labels:
    app.kubernetes.io/name: tryops
    app.kubernetes.io/component: workload-identity
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tryops-vault
  namespace: tryops
spec:
  provider:
    vault:
      server: https://vault.tryops.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tryops-runtime
          serviceAccountRef:
            name: tryops-runtime
