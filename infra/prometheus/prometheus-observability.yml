global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/tryops_alerts.yml
  - /etc/prometheus/tryops_burn_rate_alerts.yml
  - /etc/prometheus/tryops_finops_alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: tryops-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: tryops-gateway
    static_configs:
      - targets: ["gateway:8081"]
  - job_name: tryops-guardrail
    static_configs:
      - targets: ["guardrail:18083"]
  - job_name: tryops-valkey
    static_configs:
      - targets: ["valkey-exporter:9121"]
  - job_name: tryops-otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tryops-otel-bridge
    static_configs:
      - targets: ["tryops-otel-bridge:19122"]
  - job_name: tryops-loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tryops-tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
